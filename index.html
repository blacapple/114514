<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>祝你生日快乐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a; /* 深色背景更能衬托蓝色荧光 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            padding: 20px;
            z-index: 10; 
            pointer-events: none;
        }

        /* 中文：大号蓝色荧光 */
        h1 {
            font-size: clamp(40px, 10vw, 72px);
            color: #00f3ff;
            margin-bottom: 10px;
            /* 多层发光效果，打造强烈的荧光感 */
            text-shadow: 
                0 0 10px #00f3ff,
                0 0 20px #00f3ff,
                0 0 40px #00f3ff,
                0 0 80px #00b3ff;
            /* 可以加个轻微呼吸灯效果 */
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #00f3ff; }
            to { text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff, 0 0 80px #00f3ff, 0 0 120px #00b3ff; }
        }

        /* 英文：放在下面 */
        h2 {
            font-size: clamp(24px, 6vw, 40px);
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 粒子基础样式 */
        .particle {
            position: absolute;
            top: -50px; 
            pointer-events: none; 
            z-index: 1;
        }

        /* 提示按钮 */
        .fullscreen-btn {
            position: absolute;
            bottom: 40px;
            background: rgba(0, 243, 255, 0.15);
            color: #00f3ff;
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #00f3ff;
            cursor: pointer;
            font-size: 14px;
            z-index: 20;
            pointer-events: auto; 
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>祝你生日快乐</h1>
        <h2>Happy Birthday</h2>
    </div>

    <div class="fullscreen-btn" id="fs-btn">点击进入全屏体验 👆</div>

    <script>
        // 替换为你指定的表情
        const emojis = ['🎂', '💰', '💯', '🌈', '🎁', '⭐', '🎉', '🥚'];
        
        function createParticle() {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // 横向铺满
            p.style.left = Math.random() * 100 + 'vw';
            
            // 随机大小（20px 到 50px）
            const size = Math.random() * 30 + 20;
            p.style.fontSize = size + 'px';
            
            // 动态获取当前真实高度
            const screenHeight = window.innerHeight;
            
            // 随机下落时间（2.5秒到 5.5秒）
            const duration = Math.random() * 3 + 2.5;
            p.style.animationDuration = duration + 's';
            
            // 随机透明度
            p.style.opacity = Math.random() * 0.8 + 0.2; 

            // 动态生成动画，保证掉落到底部
            const randomId = Math.floor(Math.random() * 100000);
            p.style.animation = `fallDown${randomId} ${duration}s linear forwards`;
            
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fallDown${randomId} {
                    to { transform: translateY(${screenHeight + 100}px) rotate(${Math.random() * 720 - 360}deg); }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(p);
            
            // 动画结束后清理节点
            setTimeout(() => {
                p.remove();
                style.remove(); 
            }, duration * 1000);
        }
        
        // 每 100 毫秒生成一个表情
        setInterval(createParticle, 100);

        // --- 全屏逻辑 ---
        const fsBtn = document.getElementById('fs-btn');
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`全屏失败: ${err.message}`);
                    fsBtn.innerText = "请使用浏览器菜单全屏";
                });
                fsBtn.style.display = 'none'; 
            }
        });
        
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fsBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
